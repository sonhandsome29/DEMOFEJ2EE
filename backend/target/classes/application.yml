server:
  port: 8080

spring:
  application:
    name: edulearn-backend
  
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds

# Authentication
auth:
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    debug-return-token: ${PASSWORD_RESET_DEBUG_RETURN_TOKEN:false}

# CORS Configuration
cors:
  allowed-origins: http://localhost:5173,http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# Logging
logging:
  level:
    root: INFO
    com.edulearn: DEBUG
    org.springframework.security: INFO

# OpenAPI / Swagger
springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html

app:
  security:
    expose-swagger: ${EXPOSE_SWAGGER:false}
